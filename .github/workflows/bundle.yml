name: Bundle release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle-linux:
    runs-on: ubuntu-24.04
    env:
      BUNDLE_DIR: target/dx/xsensor/bundle/linux
      BUNDLE_ARTIFACT_NAME: ${{ github.event.repository.name }}-linux-bundle
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache cargo registries and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dioxus-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install system dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libxdo-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --force

      - name: Generate Linux Icon
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick

          # Generate a square 512x512 PNG package icon and verify it exists.
          # ICO files contain multiple images; extract the first one [0] and resize.
          mkdir -p icons
          convert 'icons/icon.ico[0]' -resize 512x512 icons/icon.png
          ls -la icons/
          test -f icons/icon.png

          # Make icon paths absolute to avoid cwd-dependent failures during bundling.
          ICO_PATH="$(realpath icons/icon.ico)"
          PNG_PATH="$(realpath icons/icon.png)"
          sed -i "s|^icon = .*|icon = [\"${ICO_PATH}\", \"${PNG_PATH}\"]|" Dioxus.toml

          echo "Using icons:"; ls -la icons

      - name: Bundle desktop release
        working-directory: ${{ github.workspace }}
        run: dx bundle --platform desktop --package-types deb --package-types rpm --release

      - name: Package bundles
        run: |
          echo "Checking BUNDLE_DIR: $BUNDLE_DIR"
          ls -laR "$BUNDLE_DIR" || true
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Bundle failed: directory $BUNDLE_DIR not created. Check the 'Bundle desktop release' step logs."
            exit 1
          fi

          mkdir -p staging
          find "$BUNDLE_DIR" -maxdepth 2 -type f \
            \( -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} staging/ \;

          if [ -z "$(find staging -maxdepth 1 -type f -print -quit)" ]; then
            echo "No final Linux packages were produced."
            exit 1
          fi

          echo "Final artifacts:"
          ls -lh staging/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_ARTIFACT_NAME }}
          path: staging/*
          if-no-files-found: error

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/*.deb
            staging/*.rpm

  bundle-windows:
    runs-on: windows-latest
    env:
      BUNDLE_DIR: target/dx/xsensor/bundle/windows/nsis
      PORTABLE_DIR: target/dx/xsensor/release/windows/app
      PORTABLE_ARCHIVE: ${{ github.event.repository.name }}-windows-portable.zip
      BUNDLE_ARTIFACT_NAME: ${{ github.event.repository.name }}-windows-bundle
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Cache cargo registries and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dioxus-cli-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --force

      - name: Bundle desktop release
        run: dx bundle --platform desktop --package-types nsis --release

      - name: Package bundles
        shell: pwsh
        run: |
          if (!(Test-Path -Path $env:BUNDLE_DIR)) {
            Write-Error "Bundle failed: directory $env:BUNDLE_DIR not created."
            exit 1
          }

          $stagingDirectory = Join-Path $PWD 'staging'
          New-Item -ItemType Directory -Force -Path $stagingDirectory | Out-Null

          $installers = Get-ChildItem -Path $env:BUNDLE_DIR -File -Filter '*-setup.exe'
          if ($installers.Count -eq 0) {
            Write-Error "No top-level NSIS installer was produced in $env:BUNDLE_DIR."
            exit 1
          }
          $installers | Copy-Item -Destination $stagingDirectory

          $portableExecutable = Join-Path $env:PORTABLE_DIR 'xsensor.exe'
          $portableAssets = Join-Path $env:PORTABLE_DIR 'assets'
          if (!(Test-Path -Path $portableExecutable) -or !(Test-Path -Path $portableAssets)) {
            Write-Error "Portable executable or assets are missing from $env:PORTABLE_DIR."
            exit 1
          }

          $portableStaging = Join-Path $PWD 'portable'
          New-Item -ItemType Directory -Force -Path $portableStaging | Out-Null
          Copy-Item -Path (Join-Path $env:PORTABLE_DIR '*') -Destination $portableStaging -Recurse -Force
          $portableArchive = Join-Path $stagingDirectory $env:PORTABLE_ARCHIVE
          Compress-Archive -Path (Join-Path $portableStaging '*') -DestinationPath $portableArchive -CompressionLevel Optimal

          $packages = Get-ChildItem -Path staging -File

          Write-Host "Final artifacts:"
          $packages | Format-Table Name,Length

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_ARTIFACT_NAME }}
          path: staging/*
          if-no-files-found: error

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/*.exe
            staging/*.zip
